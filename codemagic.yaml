workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags & Force Ad-Hoc Signing
        script: |
          set -e
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Linker Flags & Ad-Hoc Signing Requirements
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  
                  # CRITICAL: Must be YES and '-' to force Xcode to embed frameworks!
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'YES'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = '-'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build Ad-Hoc Device IPA
        script: |
          set -e
          
          # 1. Configure Flutter for Release Mode
          # CRITICAL FIX: Pass --no-codesign to prevent Flutter's strict certificate block
          echo "🚀 Generating release configuration..."
          flutter build ios --release --no-codesign
          
          # 2. Force Native Compilation for PHYSICAL DEVICE (arm64)
          cd ios
          echo "🛠 Compiling with xcodebuild (Ad-Hoc)..."
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$(pwd)/../build/ios" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     CODE_SIGNING_ALLOWED=YES \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="-" \
                     build
          
          cd ..
          
          # 3. Verify the DEVICE App Bundle exists
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Build failed. Runner.app not found at $APP_PATH"
            exit 1
          fi
          
          echo "✅ Device bundle compiled! Size:"
          du -sh "$APP_PATH"
          
          # 4. Ensure all internal frameworks are authenticated locally
          echo "🔨 Applying deep Ad-Hoc signature..."
          codesign --force --deep --sign - "$APP_PATH"
          
          # 5. Package for Sideloadly using ditto
          rm -rf Payload app.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa
          
          echo "📦 Final Unsigned Sideload IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa