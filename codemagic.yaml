workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject Linker Flags & Disable Signing (Bypass Pre-Flight)
        script: |
          set -e
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Linker Flags and DISABLE signing so Xcode doesn't crash on pre-flight
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  
                  # CRITICAL: We MUST set these to NO to bypass the certificate crash
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build & Force Framework Assembly
        script: |
          set -e
          
          # 1. Compile the physical device binaries. 
          # This will succeed but drop the frameworks (the 448B bug).
          echo "🚀 Compiling raw unsigned binaries..."
          flutter build ios --release --no-codesign
          
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Critical Error: Compiled Runner.app shell not found."
            exit 1
          fi
          
          echo "✅ Found app shell at: $APP_PATH"
          
          # 2. Setup Sideloadly Payload structure
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          
          # 3. Copy the base app shell (Executable, Assets, Plists)
          cp -a "$APP_PATH/"* Payload/Runner.app/
          
          # 4. THE FIX: Manually embed the frameworks Xcode refused to embed!
          echo "🛠 Manually gathering and embedding dropped frameworks..."
          mkdir -p Payload/Runner.app/Frameworks
          
          # Find and copy all compiled Pod frameworks (App.framework, bdk_flutter.framework, etc.)
          find build/ios/Release-iphoneos -name "*.framework" -type d -prune -exec cp -a {} Payload/Runner.app/Frameworks/ \;
          
          # Ensure Flutter.framework is also physically copied
          cp -a ios/Flutter/Flutter.framework Payload/Runner.app/Frameworks/ || true
          
          # 5. Apply Ad-Hoc signature deep into our manually assembled bundle
          echo "🔨 Applying deep Ad-Hoc signature to authenticated frameworks..."
          codesign --force --deep --sign - Payload/Runner.app
          
          # 6. Zip into the final IPA
          zip -r -q app.ipa Payload
          
          echo "📦 Final Assembled Sideload IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa