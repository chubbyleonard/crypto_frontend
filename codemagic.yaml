workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags & Disable Signing
        script: |
          set -e
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Linker Flags & Strip Apple Signing Requirements
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build Unsigned IPA
        script: |
          set -e
          
          # 1. Prepare Flutter asset bundles and configurations cleanly
          flutter build ios --config-only --release
          
          # 2. Direct compilation with Xcode using the simulator SDK.
          # This compiles the source into real machine code but ignores signing identities entirely.
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphonesimulator \
                     SYMROOT="$(pwd)/../build/ios" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build
          
          cd ..
          
          # 3. Define output path structure
          PROJECT_ROOT=$(pwd)
          APP_PATH="$PROJECT_ROOT/build/ios/Release-iphonesimulator/Runner.app"
          
          # 4. Verify compiler output stability
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Build failed. Compiled Runner.app was not found at $APP_PATH"
            ls -R build/ios
            exit 1
          fi
          
          echo "✅ Simulator release bundle compiled successfully!"
          
          # 5. Pack structured Payload for Sideloadly
          rm -rf Payload app.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # 6. Inject the deployment criteria so sideload software treats it as a standard package
          plutil -replace UIRequiredDeviceCapabilities -array arm64 "Payload/Runner.app/Info.plist"
          
          # Zip into the final artifact container
          zip -r -q app.ipa Payload
          
          echo "📦 Final Unsigned Sideload IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa
