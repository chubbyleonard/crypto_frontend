workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags & Disable Signing
        script: |
          set -e
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Linker Flags & Strip Apple Signing Requirements
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['DEVELOPMENT_TEAM'] = '0000000000'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build Unsigned Device IPA
        script: |
          set -e
          
          # 1. Configure Flutter for Release Mode (DEVICE)
          # We ADD --no-codesign here to stop the "No certificates found" error
          echo "🚀 Generating release configuration..."
          flutter build ios --config-only --release --no-codesign
          
          # 2. Force Native Compilation for PHYSICAL DEVICE (arm64)
          # We use a dummy Team ID to trick Xcode into compiling
          cd ios
          echo "🛠 Compiling with xcodebuild..."
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$(pwd)/../build/ios" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     DEVELOPMENT_TEAM="0000000000" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     clean build
          
          cd ..
          
          # 3. Verify the DEVICE App Bundle exists
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Build failed. Runner.app not found at $APP_PATH"
            ls -R build/ios
            exit 1
          fi
          
          echo "✅ Device bundle compiled! Size:"
          du -sh "$APP_PATH"
          
          # 4. Package for Sideloadly
          rm -rf Payload app.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Zip into an IPA file
          zip -r -q app.ipa Payload
          
          echo "📦 Final Unsigned Sideload IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa
