workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean Workspace
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Disable All Signing & Inject BDK Flags
        script: |
          set -e
          
          # Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # Inject Linker Flags and DISABLE signing on EVERY Pod so Xcode doesn't crash
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  
                  # CRITICAL: Disable signing on all Web3 Pods to bypass certificate crashes
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          # Disable signing on the main Runner target
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY = " >> ios/Flutter/Release.xcconfig
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          echo "DEAD_CODE_STRIPPING = NO" >> ios/Flutter/Release.xcconfig
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build & Manually Assemble IPA
        script: |
          set -e
          
          # 1. Compile the physical device binaries. 
          # --no-codesign stops Flutter from crashing, the NO flags stop Xcode from crashing.
          echo "🚀 Compiling raw unsigned binaries..."
          flutter build ios --release --no-codesign
          
          # 2. Locate the compiled build directory
          if [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            APP_DIR="build/ios/Release-iphoneos"
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_DIR="build/ios/iphoneos"
          else
            echo "❌ Critical Error: Compiled app shell not found."
            exit 1
          fi
          
          echo "✅ Found compiled data in: $APP_DIR"
          
          # 3. Setup Sideloadly Payload structure
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          
          # 4. Copy the base app shell (-a preserves Apple's internal metadata)
          cp -a "$APP_DIR/Runner.app/"* Payload/Runner.app/
          
          # 5. THE FIX: Manually embed the frameworks Xcode abandoned (fixes 448B bug)
          echo "🛠 Gathering and embedding native frameworks..."
          mkdir -p Payload/Runner.app/Frameworks
          
          # Find all loose frameworks (bdk_flutter, etc.) and physically copy them inside the app
          find "$APP_DIR" -maxdepth 1 -type d -name "*.framework" -exec cp -a {} Payload/Runner.app/Frameworks/ \;
          
          # 6. Apply Ad-Hoc signature deep into our manually assembled bundle to authenticate the Web3 Rust binaries
          echo "🔨 Applying deep Ad-Hoc signature..."
          codesign --force --deep --sign - Payload/Runner.app
          
          # 7. Zip into the final IPA
          zip -r -q app.ipa Payload
          
          echo "📦 Final Assembled Sideload IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa