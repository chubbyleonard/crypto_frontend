workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags
        script: |
          set -e
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Linker Flags (Do not touch signing here)
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Raw Native Build & Framework Assembly
        script: |
          set -e
          
          # 1. Generate Dart AOT and plugins ONLY. This stops Flutter from crashing on pre-flight checks.
          echo "🚀 Generating Flutter AOT..."
          flutter build ios --config-only --release
          
          # 2. Compile natively bypassing Flutter's strict wrapper
          echo "🛠 Compiling arm64 device binary natively..."
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$(pwd)/../build/ios" \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build
          cd ..
          
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Critical Error: Compiled Runner.app shell not found."
            exit 1
          fi
          
          echo "✅ Found app shell at: $APP_PATH"
          
          # 3. Setup Sideloadly Payload structure
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          
          # 4. Copy the base app shell
          cp -a "$APP_PATH/"* Payload/Runner.app/
          
          # 5. Manually gather the dropped Web3 and Pod frameworks
          echo "🛠 Gathering and embedding native frameworks..."
          mkdir -p Payload/Runner.app/Frameworks
          
          # Find all frameworks in the release folder, ignore the Runner.app itself, and copy them in
          find build/ios/Release-iphoneos -name "*.framework" -type d | grep -v "Runner.app" | xargs -I {} cp -a {} Payload/Runner.app/Frameworks/
          
          # Force copy Flutter's core framework just in case Xcode abandoned it entirely
          if [ -d "ios/Flutter/Flutter.framework" ]; then
            cp -a ios/Flutter/Flutter.framework Payload/Runner.app/Frameworks/
          fi
          
          # 6. Apply Ad-Hoc signature deep into our manually assembled bundle
          echo "🔨 Applying deep Ad-Hoc signature..."
          codesign --force --deep --sign - Payload/Runner.app
          
          # 7. Zip into the final IPA
          zip -r -q app.ipa Payload
          
          echo "📦 Final Assembled Sideload IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa