workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean Workspace & Get Packages
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          flutter pub get
          
      - name: Inject Linker & Ad-Hoc Signing Flags
        script: |
          # Force iOS 15.0 globally
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          
          # Inject linker flags and force Ad-Hoc signing
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  
                  # Enable Signing but force a dummy Ad-Hoc identity (-)
                  config.build_settings['CODE_SIGN_IDENTITY'] = '-'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'YES'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          # Inject Ad-Hoc rules into Flutter's native config
          echo "CODE_SIGN_IDENTITY=-" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=YES" >> ios/Flutter/Release.xcconfig
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          
          cd ios && pod install
          
      - name: Build Ad-Hoc iOS App & Package IPA
        script: |
          # 1. Compile Dart code and generate initial iOS structures
          flutter build ios --release --no-codesign
          
          echo "🔨 Forcing Xcode to assemble binary with Ad-Hoc signature..."
          
          # 2. Run a direct Xcode build to force the framework embedding phase
          # The identity "-" signs the app locally without needing a developer account
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$(PWD)/../build/ios" \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED="NO" \
                     CODE_SIGNING_ALLOWED="YES" \
                     build
                     
          cd ..
          
          # 3. Locate the freshly assembled Ad-Hoc app
          APP_PATH=$(find build/ios -type d -name "Runner.app" -exec du -sk {} + 2>/dev/null | sort -nr | head -n 1 | cut -f2-)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Critical Error: Runner.app not found."
            exit 1
          fi
          
          APP_SIZE=$(du -sh "$APP_PATH" | awk '{print $1}')
          echo "✅ Packaging authentic app from: $APP_PATH"
          echo "📊 Verified App Size: $APP_SIZE"
          
          # 4. Package for Sideloadly using Apple ditto
          rm -rf Payload app.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa
          
    artifacts:
      - app.ipa