workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean Workspace & Get Packages
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          flutter pub get
          
      - name: Inject Linker & Signing Flags
        script: |
          # Force iOS 15.0 globally
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          
          # Inject linker flags safely for BDK Rust bindings
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          # FORCE disable signing in the release config to satisfy Xcode build checks
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          
          cd ios && pod install
          
      - name: Build Unsigned App & Package IPA
        script: |
          # 1. Build the .app bundle
          flutter build ios --release --no-codesign --no-pub
          
          echo "🔍 Scanning system for the largest compiled Runner.app binary..."
          
          # 2. Search the workspace and Xcode's hidden DerivedData caches.
          # This calculates the size of all matching folders and strictly selects the largest one, bypassing empty shells.
          APP_PATH=$(find . ~/Library/Developer/Xcode/DerivedData -type d -name "Runner.app" -exec du -sk {} + 2>/dev/null | sort -nr | head -n 1 | cut -f2-)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Critical Error: No Runner.app found anywhere on the machine."
            exit 1
          fi
          
          # Print the size to the build logs to verify we grabbed the ~50MB file
          APP_SIZE=$(du -sh "$APP_PATH" | awk '{print $1}')
          echo "✅ Packaging authentic app from: $APP_PATH"
          echo "📊 Verified App Size: $APP_SIZE"
          
          # 3. Create Payload directory
          rm -rf Payload app.ipa
          mkdir -p Payload
          
          # 4. Safely clone the massive app bundle
          ditto "$APP_PATH" Payload/Runner.app
          
          # 5. Zip the folder into an IPA
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa
          
    artifacts:
      - app.ipa