```yaml
workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get

      - name: Inject BDK Linker Flags
        script: |
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          echo "DEAD_CODE_STRIPPING = NO" >> ios/Flutter/Release.xcconfig

      - name: Install pods
        script: |
          cd ios
          pod install --repo-update

      - name: Build, Sign Ad-Hoc & Package
        script: |
          # 1. Prepare Flutter build artifacts without letting Flutter's Xcode wrapper abort on signing
          flutter build ios --config-only --release

          # 2. Build the actual Runner.app directly using xcodebuild
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ../build/DerivedData \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          cd ..

          # 3. Locate the freshly generated full Runner.app inside the derived data
          APP_PATH=$(find build/DerivedData -type d -name "Runner.app" | head -n 1)

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Critical Error: Runner.app not found in build/DerivedData"
            exit 1
          fi

          echo "✅ Found app at: $APP_PATH"
          du -sh "$APP_PATH"

          # 4. Ad-Hoc sign the full bundle
          codesign --force --deep --sign - "$APP_PATH"

          # 5. Package into IPA for Sideloadly
          rm -rf Payload app.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa

          ls -lh app.ipa

    artifacts:
      - app.ipa