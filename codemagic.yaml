workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean Workspace & Get Packages
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          flutter pub get
          
      - name: Inject Linker Flags into EXISTING Podfile Loop
        script: |
          # Force iOS 15 Deployment Target
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          
          # Safely inject rules directly into Flutter's default block using Python
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] ||= ['$(inherited)']
                  config.build_settings['OTHER_LDFLAGS'] << '-all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          content = content.replace('flutter_additional_ios_build_settings(target)', injection)
          with open(path, 'w') as f:
              f.write(content)
          EOF
          
          python3 fix_podfile.py
          
          # Apply the linker flag to the Flutter environment configuration file
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          
          # Run pod install
          cd ios && pod install
          
      - name: Build Unsigned iOS App & Package
        script: |
          # Build standard release
          flutter build ios --release --no-codesign
          
          # 1. Create Payload folder
          mkdir -p Payload
          
          # 2. Use cp -RL to FORCE the server to follow the symlink and copy the REAL 50MB app bundle
          cp -RL build/ios/iphoneos/Runner.app Payload/
          
          # 3. Zip it (WITHOUT the -y flag, so it packages the actual files we just copied)
          zip -qr app.ipa Payload
          
    artifacts:
      - app.ipa