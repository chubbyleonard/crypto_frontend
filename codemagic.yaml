workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean Workspace & Fetch Packages
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags (NO SIGNING HACKS)
        script: |
          set -e
          # Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # Inject ONLY the linker flags to fix the Web3 FFI crash.
          # We are explicitly NOT injecting CODE_SIGNING overrides here.
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          echo "DEAD_CODE_STRIPPING = NO" >> ios/Flutter/Release.xcconfig
          
      - name: Install Pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build Unsigned App
        script: |
          set -e
          # The --no-codesign flag tells Flutter to bypass the Apple Developer check,
          # but because we didn't inject the poison pill, Xcode WILL embed the frameworks.
          echo "🚀 Compiling full unsigned device bundle..."
          flutter build ios --release --no-codesign
          
      - name: Deep Sign & Package IPA
        script: |
          set -e
          
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -name "Runner.app" -type d | grep "iphoneos" | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Critical Error: Compiled Runner.app not found."
            exit 1
          fi
          
          echo "✅ Found fully assembled app at: $APP_PATH"
          du -sh "$APP_PATH"
          
          # Deep Ad-Hoc sign the app to authenticate Web3 bindings natively
          echo "🔨 Applying local Ad-Hoc signature..."
          codesign --force --deep --sign - "$APP_PATH"
          
          # Package cleanly using ditto
          rm -rf Payload app.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa
          
          echo "📦 Final IPA Size (Should be ~40MB+):"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa