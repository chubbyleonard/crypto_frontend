workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean Workspace
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags
        script: |
          set -e
          # Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # Inject Linker Flags to prevent the Web3 FFI crash
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Trick Flutter CLI via Simulator
        script: |
          set -e
          
          # THE BYPASS: We build for the Simulator first!
          # Flutter happily skips the certificate check, generates all Xcode configurations, 
          # and prepares the AOT compiler without crashing.
          echo "🚀 Generating Flutter configurations without certificate checks..."
          flutter build ios --simulator --release --no-codesign
          
      - name: Native Device Build & Framework Assembly
        script: |
          set -e
          
          # Now that Flutter's CLI is out of the way, we use raw Xcode to force a PHYSICAL DEVICE (arm64) build.
          # We pass CODE_SIGNING_ALLOWED=NO so Xcode doesn't ask for a developer profile.
          echo "🛠 Compiling physical device binary natively via Xcode..."
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$(pwd)/../build/ios" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build
          
          cd ..
          
          # Locate Xcode's output folder
          APP_DIR="build/ios/Release-iphoneos"
          if [ ! -d "$APP_DIR/Runner.app" ]; then
            echo "❌ Critical Error: Xcode failed to build the device app shell."
            exit 1
          fi
          
          echo "✅ Found compiled device app at: $APP_DIR/Runner.app"
          
          # Setup Sideloadly Payload structure
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          
          # Copy the base app shell (-a preserves Apple's internal metadata)
          cp -a "$APP_DIR/Runner.app/"* Payload/Runner.app/
          
          # THE FIX: Manually embed the frameworks Xcode abandoned to fix the 448B bug
          echo "🛠 Gathering and embedding native Rust/Web3 frameworks..."
          mkdir -p Payload/Runner.app/Frameworks
          
          # Find all compiled frameworks and force them into the app bundle
          find "$APP_DIR" -maxdepth 1 -type d -name "*.framework" -exec cp -a {} Payload/Runner.app/Frameworks/ \;
          
          # Ensure Flutter's core framework is also transferred
          if [ -d "ios/Flutter/Flutter.framework" ]; then
            cp -a ios/Flutter/Flutter.framework Payload/Runner.app/Frameworks/
          fi
          
          # Apply Ad-Hoc signature deep into our manually assembled bundle to authenticate the frameworks
          echo "🔨 Applying deep Ad-Hoc signature..."
          codesign --force --deep --sign - Payload/Runner.app
          
          # Zip into the final IPA
          zip -r -q app.ipa Payload
          
          echo "📦 Final Assembled Sideload IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa