workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags
        script: |
          set -e
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Linker Flags for Rust/BDK
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build Unsigned IPA
        script: |
          set -e
          
          # 1. Build using Flutter with NO CODESIGNING
          # This creates a "Runner.app" without checking for Apple Certs
          echo "🚀 Starting build with --no-codesign..."
          flutter build ios --release --no-codesign
          
          # 2. Define Paths
          # Note: Flutter --release output is typically in build/ios/iphoneos
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          # 3. Verify Build Success
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Build failed. Runner.app not found at $APP_PATH"
            ls -R build/ios
            exit 1
          fi
          
          echo "✅ Unsigned Runner.app found!"
          
          # 4. Package manually into IPA
          rm -rf Payload app.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          
          # Zip it up
          zip -r -q app.ipa Payload
          
          echo "📦 Final IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa
