workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
          
      - name: Build Unsigned iOS App and Package IPA
        script: |
          # Build standard release
          flutter build ios --release --no-codesign
          
          # Package using -RL to grab the actual bundle, not a symlink shortcut
          mkdir -p build/ios/Payload
          cp -RL build/ios/iphoneos/Runner.app build/ios/Payload/
          cd build/ios
          zip -qr app.ipa Payload
          
    artifacts:
      - build/ios/app.ipa