workflows:
  crypto-wallet-workflow:
    name: Crypto Wallet Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get
          
      - name: Force iOS 15 Deployment Target
        script: |
          sed -i '' "s/^# platform :ios, '12.0'/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^# platform :ios, '13.0'/platform :ios, '15.0'/" ios/Podfile
          
      - name: Configure iOS Podfile and Native Bindings
        script: |
          cd ios
          pod repo update
          pod install
          
      - name: Build Android Release APK
        script: |
          flutter build apk --release
          
      - name: Build Unsigned iOS IPA for Sideloadly
        script: |
          # Changed: Build for simulator to bypass provisioning profiles
          flutter build ios --release --simulator
          
          # 2. Package the simulator .app into a Payload structure
          mkdir -p build/ios/iphonesimulator/Payload
          cp -r build/ios/iphonesimulator/Runner.app build/ios/iphonesimulator/Payload/
          
          # 3. Zip it into an .ipa file format
          cd build/ios/iphonesimulator
          zip -qr unsigned_sideload.ipa Payload
          
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
      - build/ios/iphonesimulator/unsigned_sideload.ipa