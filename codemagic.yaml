workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags
        script: |
          # Set minimum iOS version globally
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # Inject Rust BDK linker flags to prevent the Web3 FFI crash
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          echo "DEAD_CODE_STRIPPING = NO" >> ios/Flutter/Release.xcconfig
          
      - name: Install pods
        script: |
          cd ios
          pod install --repo-update
          
      - name: Force Device Build & Package
        script: |
          # 1. Generate Dart AOT and plugin registries (no native compilation yet)
          flutter build ios --config-only --release
          
          # 2. Force a PHYSICAL DEVICE compile natively via Xcode
          # The '-sdk iphoneos' flag completely blocks the Simulator fallback crash
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$(PWD)/../build/ios" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
                     
          cd ..
          
          # 3. Hardcode the EXACT deterministic path. NO MORE FIND COMMANDS.
          APP_PATH="build/ios/Release-iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Critical Error: Xcode failed to generate the physical device binary."
            exit 1
          fi
          
          echo "✅ Authentic Native App Found At: $APP_PATH"
          du -sh "$APP_PATH"
          
          # 4. Apply Ad-Hoc signature so the internal frameworks are authenticated
          codesign --force --deep --sign - "$APP_PATH"
          
          # 5. Cleanly package into Sideloadly IPA using Apple's ditto
          rm -rf Payload app.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa
          
          echo "📊 Final Artifact Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa