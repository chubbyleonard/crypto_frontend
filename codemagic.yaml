workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          set -e # Exit immediately if any command fails
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags
        script: |
          set -e
          # Set minimum iOS version globally
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # Inject Rust BDK linker flags
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          echo "DEAD_CODE_STRIPPING = NO" >> ios/Flutter/Release.xcconfig
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Force Device Build & Package
        script: |
          set -e
          
          # 1. Generate Dart AOT
          flutter build ios --config-only --release
          
          # 2. Define ABSOLUTE paths to prevent "cd" confusion
          PROJECT_ROOT=$(pwd)
          IOS_BUILD_DIR="$PROJECT_ROOT/build/ios"
          APP_OUTPUT_PATH="$IOS_BUILD_DIR/Release-iphoneos/Runner.app"
          
          echo "📍 Building into: $IOS_BUILD_DIR"
          
          # 3. Force Native Compilation
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     SYMROOT="$IOS_BUILD_DIR" \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          
          cd "$PROJECT_ROOT"
          
          # 4. SAFETY CHECK: Ensure the .app actually exists and has content
          if [ ! -d "$APP_OUTPUT_PATH" ]; then
            echo "❌ CRITICAL ERROR: Runner.app was not found at $APP_OUTPUT_PATH"
            echo "Listing build directory for debugging:"
            ls -R build/ios
            exit 1
          fi
          
          # Check if the binary is inside (prevents empty folder zipping)
          if [ ! -f "$APP_OUTPUT_PATH/Runner" ]; then
             echo "❌ CRITICAL ERROR: Runner binary missing inside the app bundle."
             exit 1
          fi
          
          echo "✅ Valid App Bundle found. Size:"
          du -sh "$APP_OUTPUT_PATH"
          
          # 5. Sign & Package
          codesign --force --deep --sign - "$APP_OUTPUT_PATH"
          
          rm -rf Payload app.ipa
          mkdir -p Payload
          
          # Use -v to verify files are actually copying
          ditto -v "$APP_OUTPUT_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa
          
          echo "🎁 Final IPA Created:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa
