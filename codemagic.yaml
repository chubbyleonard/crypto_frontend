- name: Build Unsigned iOS App & Package
        script: |
          # 1. Build standard release without signing to bypass the Xcode archive block
          flutter build ios --release --no-codesign
          
          # 2. Dynamic Search: Find the actual Runner.app path
          APP_PATH=$(find build/ios -name "Runner.app" -type d | grep "iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Runner.app not found. Build failed."
            exit 1
          fi
          
          echo "✅ Found app at: $APP_PATH"
          
          # 3. CRITICAL: Force Flutter to embed frameworks manually into the .app folder
          # Without this, plugins will cause immediate crashes on sideloaded launches
          echo "Embeding plugin frameworks manually..."
          export BUILT_PRODUCTS_DIR="$(dirname "$APP_PATH")"
          export FRAMEWORKS_FOLDER_PATH="Runner.app/Frameworks"
          if [ -f "ios/Flutter/flutter_export_environment.sh" ]; then
            source ios/Flutter/flutter_export_environment.sh
            # Execute Flutter's internal framework embedding tool
            "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" embed_frameworks
          fi
          
          # 4. Create Payload and Copy
          rm -rf Payload app.ipa
          mkdir -p Payload
          
          # -RL ensures we follow symlinks and copy actual binary data
          cp -RL "$APP_PATH" Payload/
          
          # 5. Zip it into the final IPA
          zip -qr app.ipa Payload