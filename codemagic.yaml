workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
        
      - name: Force iOS 15 Deployment Target
        script: |
          rm -f ios/Podfile.lock
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          
      - name: Build Unsigned iOS App (Profile Mode)
        script: |
          # 1. Use --profile to permanently bypass Xcode's dead-code stripping of the Rust bridge
          flutter build ios --profile --no-codesign
          
          # 2. Package the IPA (Using -RL to copy the REAL 50MB folder, not a 166-byte shortcut)
          mkdir -p build/ios/Payload
          cp -RL build/ios/iphoneos/Runner.app build/ios/Payload/
          
          # 3. Zip it into the final Sideloadly format
          cd build/ios
          zip -qr app.ipa Payload
          
    artifacts:
      - build/ios/app.ipa