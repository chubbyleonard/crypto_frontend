workflows:
  crypto-wallet-workflow:
    name: Crypto Wallet Release Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fetch Flutter Dependencies
        script: |
          flutter pub get
          
      - name: Configure iOS Podfile and Native Bindings
        script: |
          cd ios
          pod install
          
      - name: Build Android Release APK
        script: |
          flutter build apk --release
          
      - name: Build Unsigned iOS IPA for Sideloadly
        script: |
          # 1. Build the unsigned iOS app
          flutter build ios --release --no-codesign
          
          # 2. Package the .app into a Payload structure
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          
          # 3. Zip it into an .ipa file format
          cd build/ios/iphoneos
          zip -qr unsigned_sideload.ipa Payload
          
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
      - build/ios/iphoneos/unsigned_sideload.ipa