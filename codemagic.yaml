workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Linker Flags (No Signing Overrides)
        script: |
          set -e
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Linker Flags ONLY. 
          # We explicitly REMOVED the CODE_SIGNING overrides so Flutter doesn't crash.
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build & Manually Assemble Frameworks
        script: |
          set -e
          
          # 1. Compile the physical device binaries normally without triggering the certificate crash
          echo "🚀 Compiling raw unsigned binaries..."
          flutter build ios --release --no-codesign
          
          # 2. Locate the compiled shell
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/Release-iphoneos/Runner.app"
          else
            echo "❌ Critical Error: Compiled Runner.app not found."
            exit 1
          fi
          
          echo "✅ Found app shell at: $APP_PATH"
          
          # 3. Create Payload and copy the shell
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          
          # Use cp -a to safely preserve all internal Apple metadata
          cp -a "$APP_PATH/"* Payload/Runner.app/
          
          # 4. THE FIX: Manually embed any frameworks that Xcode abandoned during the unsigned build
          echo "🛠 Manually gathering and embedding native frameworks..."
          mkdir -p Payload/Runner.app/Frameworks
          
          # Check Xcode's intermediate build folder and forcefully copy the Rust/Pod frameworks into the app
          if [ -d "build/ios/Release-iphoneos" ]; then
            find build/ios/Release-iphoneos -maxdepth 1 -name "*.framework" -exec cp -a {} Payload/Runner.app/Frameworks/ \;
          fi
          
          # 5. Apply Ad-Hoc signature deep into our manually assembled bundle
          echo "🔨 Applying deep Ad-Hoc signature to authenticated frameworks..."
          codesign --force --deep --sign - Payload/Runner.app
          
          # 6. Zip into the final IPA
          zip -r -q app.ipa Payload
          
          echo "📦 Final Assembled Sideload IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa