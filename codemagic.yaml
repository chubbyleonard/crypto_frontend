workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Clean Workspace
        script: |
          set -e
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          
      - name: Inject BDK Flags & Surgically Patch Xcode Project
        script: |
          set -e
          
          # 1. Update minimum iOS deployment target globally
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Rust Web3 Linker Flags (Prevents the FFI Crash)
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          # 3. THE NUCLEAR OPTION: Hack the root project file
          # This completely lobotomizes Apple's certificate checks before Flutter even boots up.
          cat << 'EOF' > patch_xcode.py
          import re
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              c = f.read()
              
          # Strip all Apple Development Team references
          c = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', '', c)
          c = re.sub(r'DevelopmentTeam = [^;]*;', '', c)
          c = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;', 'PROVISIONING_PROFILE_SPECIFIER = "";', c)
          
          # Force Ad-Hoc signature (the '-' identity) instead of a real Apple profile
          c = re.sub(r'CODE_SIGN_IDENTITY = [^;]*;', 'CODE_SIGN_IDENTITY = "-";', c)
          c = re.sub(r'"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = [^;]*;', '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "-";', c)
          
          # Force Xcode to ALLOW signing so your native frameworks are actually embedded (Fixes 448B bug)
          c = re.sub(r'CODE_SIGNING_ALLOWED = [^;]*;', 'CODE_SIGNING_ALLOWED = YES;', c)
          
          with open(path, 'w') as f:
              f.write(c)
          EOF
          python3 patch_xcode.py
          
      - name: Install pods
        script: |
          set -e
          cd ios
          pod install --repo-update
          
      - name: Build Ad-Hoc iOS App & Package
        script: |
          set -e
          
          # 1. Build the app. We DO NOT use --no-codesign here!
          # Flutter will read our hacked project file, apply the Ad-Hoc signature, and embed the frameworks cleanly.
          echo "🚀 Compiling full device bundle with Ad-Hoc identity..."
          flutter build ios --release
          
          # 2. Locate the fully assembled bundle
          APP_PATH=$(find build/ios -type d -name "Runner.app" | grep "iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Critical Error: Runner.app not found."
            exit 1
          fi
          
          echo "✅ Found assembled app at: $APP_PATH"
          du -sh "$APP_PATH"
          
          # 3. FAILSAFE: Physically drag any abandoned frameworks into the app just in case Xcode glitches
          echo "🛠 Ensuring all native frameworks are embedded..."
          mkdir -p "$APP_PATH/Frameworks"
          find build/ios/Release-iphoneos -maxdepth 1 -type d -name "*.framework" -exec cp -a {} "$APP_PATH/Frameworks/" \; 2>/dev/null || true
          
          # 4. Apply a final, deep Ad-Hoc signature to the entire payload to authenticate the frameworks
          echo "🔨 Applying deep Ad-Hoc signature..."
          codesign --force --deep --sign - "$APP_PATH"
          
          # 5. Create Payload and package with ditto to preserve Apple metadata
          rm -rf Payload app.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa
          
          echo "📦 Final IPA Size:"
          ls -lh app.ipa
          
    artifacts:
      - app.ipa