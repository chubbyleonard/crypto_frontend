workflows:
  ios-sideload-workflow:
    name: iOS Sideloadly Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages & clean
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get

      - name: Inject BDK Linker Flags (No Signing Overrides)
        script: |
          # Set minimum iOS version globally
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # Inject ONLY the Rust BDK linker flags to prevent the FFI crash.
          # We are explicitly NOT overriding CODE_SIGNING here so Flutter's embed script runs.
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py
          
          # Append strictly linker flags to Flutter's native config
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          echo "DEAD_CODE_STRIPPING = NO" >> ios/Flutter/Release.xcconfig

      - name: Install pods
        script: |
          cd ios
          pod install --repo-update

      - name: Build, Sign Ad-Hoc & Package
        script: |
          # 1. Let Flutter handle the unsigned build natively so frameworks are actually embedded
          flutter build ios --release --no-codesign

          # 2. Safely locate the fully compiled bundle
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/ios -type d -name "Runner.app" | grep -v "archive" | head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Critical Error: Runner.app not found."
            exit 1
          fi

          # This will now print ~50MB instead of a few bytes
          echo "✅ Found app at: $APP_PATH"
          du -sh "$APP_PATH"

          # 3. Apply Ad-Hoc signature deep into the fully assembled bundle
          echo "🔨 Applying deep Ad-Hoc signature..."
          codesign --force --deep --sign - "$APP_PATH"

          # 4. Package using ditto to preserve Apple bundle structure
          rm -rf Payload app.ipa
          mkdir -p Payload
          ditto "$APP_PATH" Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload app.ipa

          ls -lh app.ipa

    artifacts:
      - app.ipa