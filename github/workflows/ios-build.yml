name: iOS Sideloadly TRUE DEBUG

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Nuke Caches
        run: |
          flutter clean
          flutter pub get

      - name: Lobotomize Apple Certificate Checks (CRITICAL FOR GITHUB)
        run: |
          set -e
          
          # 1. Strip the Development Team ID from the root Xcode project
          cat << 'EOF' > patch_xcode.py
          import re
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              c = f.read()
              
          c = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', '', c)
          c = re.sub(r'DevelopmentTeam = [^;]*;', '', c)
          c = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;', 'PROVISIONING_PROFILE_SPECIFIER = "";', c)
          
          with open(path, 'w') as f:
              f.write(c)
          EOF
          python3 patch_xcode.py
          
          # 2. Disable signing on CocoaPods to prevent dependency failures
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned Debug App (Preserves Symbols)
        run: flutter build ios --debug --no-codesign

      - name: Package Clean IPA for Sideloadly
        run: |
          set -e
          
          APP_DIR="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_DIR" ]; then 
             APP_DIR="build/ios/Debug-iphoneos/Runner.app"
          fi
          
          echo "Packaging from: $APP_DIR"
          
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          cp -a "$APP_DIR/"* Payload/Runner.app/
          
          # Strip static artifacts out so Sideloadly's Mach-O parser doesn't crash
          find Payload/Runner.app -name "*.a" -type f -delete || true
          find Payload/Runner.app/Frameworks -name "*.framework" -type d | while read fw; do
            bin_name=$(basename "$fw" .framework)
            if [ -f "$fw/$bin_name" ] && file "$fw/$bin_name" | grep -q "current ar archive"; then
               rm -rf "$fw"
            fi
          done || true
          
          codesign --force --deep --sign - Payload/Runner.app
          zip -r -q app.ipa Payload
          
          echo "FINAL IPA SIZE:"
          ls -lh app.ipa

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: TRUE-DEBUG-IPA
          path: app.ipa
          retention-days: 3
