name: iOS Sideloadly Release

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: 💉 Swift Injection FFI Binding (The Ultimate Fix)
        run: |
          set -e
          
          # We use python to explicitly bind the missing Rust math symbols inside Swift.
          # Because Swift natively references the memory address of these symbols,
          # Apple's compiler is strictly forbidden from stripping them, regardless of Xcode settings.
          cat << 'EOF' > inject_swift.py
          import os
          import re
          
          path = 'ios/Runner/AppDelegate.swift'
          with open(path, 'r') as f:
              content = f.read()
          
          # 1. We manually force the specific symbols Dart is crashing on
          symbols_to_bind = ['new_uint_8_list_0', 'store_dart_post_cobject']
          
          # 2. We dynamically search the ENTIRE ios directory to capture any other FRB bundling methods
          for root, dirs, files in os.walk('ios'):
              for file in files:
                  if file.endswith(('.h', '.m', '.swift', '.c')):
                      try:
                          with open(os.path.join(root, file), 'r') as f:
                              matches = re.findall(r'([a-zA-Z0-9_]*dummy_method_to_enforce_bundling[a-zA-Z0-9_]*)', f.read())
                              symbols_to_bind.extend(matches)
                      except:
                          pass
          
          symbols_to_bind = list(set(symbols_to_bind))
          
          injection_top = "\n// FORCED BINDINGS TO PREVENT RUST SYMBOL STRIPPING\n"
          injection_inside = "\n        // Grab memory addresses to force linker extraction\n"
          
          for i, func in enumerate(symbols_to_bind):
              # @_silgen_name binds a Swift function directly to a C symbol without needing a header
              injection_top += f'@_silgen_name("{func}")\nfunc force_bind_rust_symbol_{i}()\n'
              injection_inside += f'        let _ = force_bind_rust_symbol_{i}\n'
          
          if 'force_bind_rust_symbol' not in content:
              content = content.replace('import Flutter', 'import Flutter\n' + injection_top)
              marker = 'didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {'
              content = content.replace(marker, marker + injection_inside)
              
              with open(path, 'w') as f:
                  f.write(content)
              print(f"✅ Successfully injected C-symbol bindings into AppDelegate.swift: {symbols_to_bind}")
          EOF
          python3 inject_swift.py

      - name: ⚙️ Force Static Linkage & Disable App Store Bloat
        run: |
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          cat << 'EOF' > fix_podfile.py
          import re
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          # Force CocoaPods to embed the Rust library directly into the main Runner executable
          if 'use_frameworks! :linkage => :static' not in content:
              content = re.sub(r'use_frameworks!.*', "use_frameworks! :linkage => :static", content)
              if 'use_frameworks!' not in content:
                  content = "use_frameworks! :linkage => :static\n" + content
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              
          with open(path, 'w') as f:
              f.write(content)
          EOF
          python3 fix_podfile.py

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          
      - name: Build Unsigned Release App Natively
        run: |
          # The Swift bindings protect the symbols now, so we can run a clean, standard flutter build
          flutter build ios --release --no-codesign
          
      - name: Package Clean IPA for Sideloadly
        run: |
          set -e
          APP_DIR="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_DIR" ]; then APP_DIR="build/ios/Release-iphoneos/Runner.app"; fi
          
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          cp -a "$APP_DIR/"* Payload/Runner.app/
          
          # Strip static artifacts out so Sideloadly's Mach-O parser doesn't choke
          find Payload/Runner.app -name "*.a" -type f -delete || true
          find Payload/Runner.app/Frameworks -name "*.framework" -type d | while read fw; do
            bin_name=$(basename "$fw" .framework)
            if [ -f "$fw/$bin_name" ] && file "$fw/$bin_name" | grep -q "current ar archive"; then
               rm -rf "$fw"
            fi
          done || true
          
          codesign --force --deep --sign - Payload/Runner.app
          zip -r -q app.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sideload-Release-IPA
          path: app.ipa
          retention-days: 3
