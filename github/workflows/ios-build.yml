name: iOS Sideloadly Release

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Podfile Deployment Target
        run: |
          set -e
          # Force iOS 15.0 Deployment Target across the entire workspace configuration
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_INSTALLED_PRODUCT'] = 'NO'
                  config.build_settings['COPY_PHASE_STRIP'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  config.build_settings['DEPLOYMENT_POSTPROCESSING'] = 'NO'
                  
                  # Bypasses local workspace code signing rules
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned App with Flag Overrides
        run: |
          # The '--' separator appends arguments directly to the underlying xcodebuild execution.
          # This guarantees optimization blocks are bypassed, forcing symbols to remain unstripped.
          flutter build ios --release --no-codesign -- \
            DEAD_CODE_STRIPPING=NO \
            STRIP_INSTALLED_PRODUCT=NO \
            COPY_PHASE_STRIP=NO \
            DEPLOYMENT_POSTPROCESSING=NO \
            STRIP_STYLE=non-global \
            OTHER_LDFLAGS="\$(inherited) -all_load -Wl,-export_dynamic"

      - name: Manually Assemble Frameworks & Package IPA
        run: |
          set -e
          
          APP_DIR="build/ios/iphoneos"
          if [ ! -d "$APP_DIR/Runner.app" ]; then
            APP_DIR="build/ios/Release-iphoneos"
          fi
          
          echo "Found compiled data in: $APP_DIR"
          
          # Reset Payload structure
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          
          # Copy the base app bundle
          cp -a "$APP_DIR/Runner.app/"* Payload/Runner.app/
          
          # Ensure Frameworks directory exists
          mkdir -p Payload/Runner.app/Frameworks
          
          # Copy compiled dynamic frameworks
          find build/ios -path "*/Release-iphoneos/*.framework" -type d | grep -v "Runner.app" | while read fw; do
            cp -a "$fw" Payload/Runner.app/Frameworks/ || true
          done
          
          if [ -d "ios/Flutter/Flutter.framework" ]; then
            cp -a ios/Flutter/Flutter.framework Payload/Runner.app/Frameworks/ || true
          fi
          
          # Remove non-dynamic architecture objects to preserve Mach-O structure validation
          for fw in Payload/Runner.app/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            bin_name=$(basename "$fw" .framework)
            target_bin="$fw/$bin_name"
            
            if [ ! -f "$target_bin" ]; then
              rm -rf "$fw"
            elif file "$target_bin" | grep -q "current ar archive"; then
              rm -rf "$fw"
            elif ! file "$target_bin" | grep -q "dynamically linked"; then
              rm -rf "$fw"
            fi
          done
          
          # Force pseudo-ad-hoc code signature over frameworks so Sideloadly can process the package identity
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - {} \; || true
          codesign --force --deep --sign - Payload/Runner.app
          
          # Zip into final testing package container
          zip -r -q app.ipa Payload
          ls -lh app.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sideload-Release-IPA
          path: app.ipa
          retention-days: 3
