name: iOS Sideloadly Release

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: 🩹 Inject Dummy Method to Prevent Stripping
        run: |
          set -e
          
          # 1. SEARCH for the generated header file containing the dummy method
          # Usually named 'bridge_generated.h' or 'frb.h'
          HEADER_FILE=$(find ios/Runner -name "*.h" -print0 | xargs -0 grep -l "dummy_method_to_enforce_bundling" || true)
          
          if [ -z "$HEADER_FILE" ]; then
            echo "⚠️ Warning: Could not find a header with 'dummy_method_to_enforce_bundling'."
            echo "Attempting to proceed with linker flags only..."
          else
            echo "✅ Found dummy method in: $HEADER_FILE"
            FILENAME=$(basename "$HEADER_FILE")
            
            # 2. Ensure Bridging Header imports it
            BRIDGING_HEADER="ios/Runner/Runner-Bridging-Header.h"
            if [ ! -f "$BRIDGING_HEADER" ]; then
              echo "// Created by GitHub Actions" > "$BRIDGING_HEADER"
            fi
            
            if ! grep -q "$FILENAME" "$BRIDGING_HEADER"; then
              echo "Injecting import into Bridging Header..."
              echo "#import \"$FILENAME\"" >> "$BRIDGING_HEADER"
            fi
            
            # 3. Inject the CALL into AppDelegate.swift
            APP_DELEGATE="ios/Runner/AppDelegate.swift"
            if [ -f "$APP_DELEGATE" ]; then
              if ! grep -q "dummy_method_to_enforce_bundling" "$APP_DELEGATE"; then
                echo "💉 Injecting dummy call into AppDelegate.swift..."
                # We use python to safely insert it inside the didFinishLaunchingWithOptions function
                cat << 'EOF' > inject_dummy.py
          import sys
          
          path = 'ios/Runner/AppDelegate.swift'
          with open(path, 'r') as f:
              content = f.read()
              
          if 'dummy_method_to_enforce_bundling' not in content:
              # Look for the return statement or end of function to insert before it
              marker = 'return super.application(application, didFinishLaunchingWithOptions: launchOptions)'
              injection = '    let _ = dummy_method_to_enforce_bundling()\n    ' + marker
              
              if marker in content:
                  content = content.replace(marker, injection)
              else:
                  # Fallback: try to insert at start of function
                  marker = 'didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {'
                  injection = marker + '\n    let _ = dummy_method_to_enforce_bundling()'
                  content = content.replace(marker, injection)
                  
          with open(path, 'w') as f:
              f.write(content)
          EOF
                python3 inject_dummy.py
              else
                echo "👌 AppDelegate already calls dummy method."
              fi
            fi
          fi

      - name: Configure Linker & Force Static Linkage
        run: |
          set -e
          
          # Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # Configure Podfile for Static Linkage (Vital for FFI)
          cat << 'EOF' > fix_podfile.py
          import re
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          # Force static linkage
          if "use_frameworks!" in content:
              content = re.sub(r'use_frameworks!.*', "use_frameworks! :linkage => :static", content)
          else:
              content = "use_frameworks! :linkage => :static\n" + content
              
          # Inject build settings
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO' 
                  config.build_settings['STRIP_INSTALLED_PRODUCT'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  config.build_settings['GCC_SYMBOLS_PRIVATE_EXTERN'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              
          with open(path, 'w') as f:
              f.write(content)
          EOF
          python3 fix_podfile.py
          
          # Inject Flags into Release.xcconfig
          CONFIG_PATH="ios/Flutter/Release.xcconfig"
          echo "" >> $CONFIG_PATH
          echo "DEAD_CODE_STRIPPING = NO" >> $CONFIG_PATH
          echo "STRIP_INSTALLED_PRODUCT = NO" >> $CONFIG_PATH
          echo "STRIP_STYLE = non-global" >> $CONFIG_PATH
          echo "GCC_SYMBOLS_PRIVATE_EXTERN = NO" >> $CONFIG_PATH
          # We add -Wl,-export_dynamic to ensure symbols are visible to dlsym
          echo "OTHER_LDFLAGS = \$(inherited) -all_load -Wl,-export_dynamic" >> $CONFIG_PATH

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned Release App
        run: |
          flutter build ios --release --no-codesign -- \
            DEAD_CODE_STRIPPING=NO \
            STRIP_INSTALLED_PRODUCT=NO \
            GCC_SYMBOLS_PRIVATE_EXTERN=NO

      - name: Package IPA Correctly
        run: |
          set -e
          APP_DIR="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_DIR" ]; then APP_DIR="build/ios/Release-iphoneos/Runner.app"; fi
          
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          cp -a "$APP_DIR/"* Payload/Runner.app/
          
          # Clean static frameworks
          find Payload/Runner.app/Frameworks -name "*.framework" -type d | while read fw; do
            bin_name=$(basename "$fw" .framework)
            if file "$fw/$bin_name" | grep -q "current ar archive"; then
               rm -rf "$fw"
            fi
          done
          
          codesign --force --deep --sign - Payload/Runner.app
          zip -r -q app.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sideload-Release-IPA
          path: app.ipa
          retention-days: 3
