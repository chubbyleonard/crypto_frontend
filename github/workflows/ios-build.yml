name: iOS Sideloadly Release

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Lobotomize Apple Certificate Checks & Inject BDK Flags
        run: |
          set -e
          
          # 1. Strip the Development Team ID from the root Xcode project
          cat << 'EOF' > patch_xcode.py
          import re
          path = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(path, 'r') as f:
              c = f.read()
              
          c = re.sub(r'DEVELOPMENT_TEAM = [^;]*;', '', c)
          c = re.sub(r'DevelopmentTeam = [^;]*;', '', c)
          c = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;', 'PROVISIONING_PROFILE_SPECIFIER = "";', c)
          
          # 1a. KILL ALL XCODE STRIPPING MECHANISMS
          c = re.sub(r'DEAD_CODE_STRIPPING = YES;', 'DEAD_CODE_STRIPPING = NO;', c)
          c = re.sub(r'STRIP_INSTALLED_PRODUCT = YES;', 'STRIP_INSTALLED_PRODUCT = NO;', c)
          c = re.sub(r'COPY_PHASE_STRIP = YES;', 'COPY_PHASE_STRIP = NO;', c)
          c = re.sub(r'STRIP_STYLE = [^;]*;', 'STRIP_STYLE = "non-global";', c)
          
          with open(path, 'w') as f:
              f.write(c)
          EOF
          python3 patch_xcode.py
          
          # 1b. Guarantee overrides in Flutter's Release config
          echo "DEAD_CODE_STRIPPING = NO" >> ios/Flutter/Release.xcconfig
          echo "STRIP_INSTALLED_PRODUCT = NO" >> ios/Flutter/Release.xcconfig
          echo "COPY_PHASE_STRIP = NO" >> ios/Flutter/Release.xcconfig
          echo "DEPLOYMENT_POSTPROCESSING = NO" >> ios/Flutter/Release.xcconfig
          echo "STRIP_STYLE = non-global" >> ios/Flutter/Release.xcconfig
          echo "OTHER_LDFLAGS = \$(inherited) -all_load" >> ios/Flutter/Release.xcconfig
          
          # 2. Force iOS 15.0 Deployment Target globally
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 3. Inject BDK Linker Flags and disable signing on CocoaPods
          cat << 'EOF' > fix_podfile.py
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['OTHER_LDFLAGS'] = '$(inherited) -all_load'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO'
                  config.build_settings['STRIP_INSTALLED_PRODUCT'] = 'NO'
                  config.build_settings['COPY_PHASE_STRIP'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  
                  # Disable signing on CocoaPods
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              with open(path, 'w') as f:
                  f.write(content)
          EOF
          python3 fix_podfile.py

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned App Natively
        run: flutter build ios --release --no-codesign

      - name: Manually Assemble Frameworks & Package IPA
        run: |
          set -e
          
          APP_DIR="build/ios/iphoneos"
          if [ ! -d "$APP_DIR/Runner.app" ]; then
            APP_DIR="build/ios/Release-iphoneos"
          fi
          
          echo "Found compiled data in: $APP_DIR"
          
          # Reset Payload structure
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          
          # Copy the base app bundle
          cp -a "$APP_DIR/Runner.app/"* Payload/Runner.app/
          
          # Ensure Frameworks directory exists
          mkdir -p Payload/Runner.app/Frameworks
          
          # Copy compiled frameworks
          find build/ios -path "*/Release-iphoneos/*.framework" -type d | grep -v "Runner.app" | while read fw; do
            cp -a "$fw" Payload/Runner.app/Frameworks/ || true
          done
          
          if [ -d "ios/Flutter/Flutter.framework" ]; then
            cp -a ios/Flutter/Flutter.framework Payload/Runner.app/Frameworks/ || true
          fi
          
          # Remove static frameworks that crash Sideloadly's Mach-O signer
          for fw in Payload/Runner.app/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            bin_name=$(basename "$fw" .framework)
            target_bin="$fw/$bin_name"
            
            if [ ! -f "$target_bin" ]; then
              echo "Removing non-binary framework: $fw"
              rm -rf "$fw"
            elif file "$target_bin" | grep -q "current ar archive"; then
              echo "Removing static archive framework: $fw"
              rm -rf "$fw"
            elif ! file "$target_bin" | grep -q "dynamically linked"; then
              echo "Removing non-dynamic framework: $fw"
              rm -rf "$fw"
            fi
          done
          
          # Sign all remaining dynamic frameworks individually, then sign the app shell
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - {} \; || true
          codesign --force --deep --sign - Payload/Runner.app
          
          # Zip into final IPA
          zip -r -q app.ipa Payload
          ls -lh app.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sideload-Release-IPA
          path: app.ipa
          retention-days: 3
