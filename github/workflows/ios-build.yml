name: iOS Sideloadly Release

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Linker & Force Static Embedding
        run: |
          set -e
          
          # 1. Force iOS 15.0 Deployment Target
          sed -i '' "s/# platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          sed -i '' "s/platform :ios.*/platform :ios, '15.0'/" ios/Podfile || true
          
          # 2. Inject Static Linkage & Build Settings into Podfile
          cat << 'EOF' > fix_podfile.py
          import re
          path = 'ios/Podfile'
          with open(path, 'r') as f:
              content = f.read()
              
          # Force CocoaPods to use static linkage (merges Rust lib into main binary)
          if "use_frameworks!" in content:
              content = re.sub(r'use_frameworks!.*', "use_frameworks! :linkage => :static", content)
          else:
              content = "use_frameworks! :linkage => :static\n" + content
              
          # Inject strict anti-strip settings for all Pods
          target_hook = 'flutter_additional_ios_build_settings(target)'
          injection = """flutter_additional_ios_build_settings(target)
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
                  config.build_settings['DEAD_CODE_STRIPPING'] = 'NO' 
                  config.build_settings['STRIP_INSTALLED_PRODUCT'] = 'NO'
                  config.build_settings['STRIP_STYLE'] = 'non-global'
                  config.build_settings['DEPLOYMENT_POSTPROCESSING'] = 'NO'
                  config.build_settings['GCC_SYMBOLS_PRIVATE_EXTERN'] = 'NO'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  # We DO NOT override OTHER_LDFLAGS here to avoid breaking Pod linking
                end"""
                
          if target_hook in content:
              content = content.replace(target_hook, injection)
              
          with open(path, 'w') as f:
              f.write(content)
          EOF
          python3 fix_podfile.py
          
          # 3. Inject Linker Flags into Release.xcconfig
          # This is the SAFE place to add flags without breaking CocoaPods
          CONFIG_PATH="ios/Flutter/Release.xcconfig"
          echo "" >> $CONFIG_PATH
          echo "// INJECTED BY GITHUB ACTIONS" >> $CONFIG_PATH
          echo "DEAD_CODE_STRIPPING = NO" >> $CONFIG_PATH
          echo "STRIP_INSTALLED_PRODUCT = NO" >> $CONFIG_PATH
          echo "STRIP_STYLE = non-global" >> $CONFIG_PATH
          echo "DEPLOYMENT_POSTPROCESSING = NO" >> $CONFIG_PATH
          echo "GCC_SYMBOLS_PRIVATE_EXTERN = NO" >> $CONFIG_PATH
          # CRITICAL: This combines inherited Pod flags with our required symbols
          echo "OTHER_LDFLAGS = \$(inherited) -all_load -Wl,-export_dynamic -Wl,-u,_new_uint_8_list_0" >> $CONFIG_PATH

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build Unsigned Release App
        run: |
          # We REMOVED 'OTHER_LDFLAGS' from the command line arguments below.
          # This ensures xcodebuild uses the values we injected into Release.xcconfig,
          # which correctly include the CocoaPods libraries.
          flutter build ios --release --no-codesign -- \
            DEAD_CODE_STRIPPING=NO \
            STRIP_INSTALLED_PRODUCT=NO \
            STRIP_STYLE=non-global \
            DEPLOYMENT_POSTPROCESSING=NO \
            GCC_SYMBOLS_PRIVATE_EXTERN=NO

      - name: Package IPA Correctly
        run: |
          set -e
          
          APP_DIR="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_DIR" ]; then
             APP_DIR="build/ios/Release-iphoneos/Runner.app"
          fi
          
          echo "Packaging from: $APP_DIR"
          
          rm -rf Payload app.ipa
          mkdir -p Payload/Runner.app
          
          # Copy target application bundle properties cleanly
          cp -a "$APP_DIR/"* Payload/Runner.app/
          
          # Clean up static libraries
          find Payload/Runner.app/Frameworks -name "*.framework" -type d | while read fw; do
            bin_name=$(basename "$fw" .framework)
            if file "$fw/$bin_name" | grep -q "current ar archive"; then
               echo "Removing static archive artifact wrapper: $fw"
               rm -rf "$fw"
            fi
          done
          
          # Fake Sign
          codesign --force --deep --sign - Payload/Runner.app
          
          zip -r -q app.ipa Payload
          ls -lh app.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sideload-Release-IPA
          path: app.ipa
          retention-days: 3
